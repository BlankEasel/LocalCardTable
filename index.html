<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードゲーム・フリープレイ</title>
  <link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23a78bfa" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'>
  <style>
    :root { 
      color-scheme: dark; 
      --panel: rgba(15, 23, 42, 0.85); 
      --panel-border: rgba(255, 255, 255, 0.1); 
      --muted: #94a3b8; 
      --violet: #7c3aed; 
      --violet-hover: #6d28d9;
      --dock-height: 270px;
      --preview-width: 280px;
    }
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top left, #312e81, #0f172a 42%, #020617);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; transition: background 0.2s, transform 0.1s; }
    button:disabled { cursor: not-allowed; opacity: 0.45; transform: none !important; }
    
    header { 
      position: absolute;
      top: 0; 
      left: 0; 
      right: var(--preview-width); 
      height: 64px;
      background: rgba(15, 23, 42, 0.95); 
      backdrop-filter: blur(12px); 
      border-bottom: 1px solid var(--panel-border); 
      padding: 0 24px; 
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      transition: right 0.1s ease;
    }
    @media(max-width: 768px) {
      header { height: auto; padding: 10px 16px; flex-direction: column; align-items: flex-start; gap: 8px; position: relative; right: 0; }
      html, body { overflow: auto; }
    }

    .app-layout {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .app { 
      flex: 1;
      height: 100%;
      display: flex; 
      flex-direction: column; 
      padding-top: 72px;
      padding-bottom: var(--dock-height);
      padding-left: 24px;
      padding-right: 24px;
      transition: padding-bottom 0.1s ease-out;
      overflow: hidden;
      max-width: calc(100vw - var(--preview-width));
    }
    @media(min-width: 768px) { .app { padding-left: 32px; padding-right: 32px; } }

    .preview-sidebar {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: var(--preview-width);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--panel-border);
      z-index: 110;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.1s ease;
    }
    .preview-sidebar.collapsed {
      width: 44px;
    }
    .preview-resizer {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: ew-resize;
      z-index: 120;
    }
    .preview-sidebar.collapsed .preview-resizer {
      display: none;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 12px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }
    .preview-header h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #c4b5fd;
      white-space: nowrap;
      overflow: hidden;
    }
    .preview-sidebar.collapsed .preview-header h3 {
      display: none;
    }
    .preview-body {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      gap: 10px;
    }
    .preview-sidebar.collapsed .preview-body {
      display: none;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
      width: 100%;
    }

    .eyebrow-wrap { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
    .eyebrow-wrap svg { width: 20px; height: 20px; color: #c4b5fd; }
    .eyebrow { color: #c4b5fd; font-weight: 800; font-size: 12px; letter-spacing: 0.24em; }
    
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 10px; 
      padding: 8px 14px; 
      color: #fff; 
      background: rgba(255, 255, 255, 0.05); 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.1); }
    .btn.primary { background: #7c3aed; border-color: transparent; }
    .btn.primary:hover { background: #6d28d9; }
    .btn.secondary { background: rgba(255, 255, 255, 0.1); }
    .btn.secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .btn.danger-ghost { background: transparent; border-color: transparent; color: #fb7185; }
    .btn.danger-ghost:hover { background: rgba(244, 63, 94, 0.1); }

    .play-area { display: flex; flex-direction: column; gap: 16px; width: 100%; }

    .bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: var(--preview-width);
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--panel-border);
      padding: 10px 24px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: right 0.1s ease;
    }
    @media(min-width: 768px) {
      .bottom-dock { padding-left: 32px; padding-right: 32px; }
    }
    @media(max-width: 768px) {
      .bottom-dock { padding: 8px 12px; position: relative; right: 0; }
    }

    .panel { 
      border: 1px solid var(--panel-border); 
      border-radius: 10px; 
      background: var(--panel); 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); 
      backdrop-filter: blur(8px);
      overflow: hidden; 
      width: 100%;
    }
    details.panel summary::-webkit-details-marker { display: none; }
    details.panel summary { list-style: none; }

    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px; flex-wrap: wrap; gap: 8px; cursor: pointer; }
    .panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .panel-head h2 svg { width: 18px; height: 18px; color: #a78bfa; }
    
    .panel-body { padding: 0 10px 10px 10px; }
    
    .badge { border-radius: 999px; background: rgba(255, 255, 255, 0.1); padding: 4px 10px; font-size: 11px; font-weight: 500; }

    .editor-list { display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto; padding-right: 4px; }
    .editor-row { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; background: rgba(255, 255, 255, 0.04); }
    @media(min-width: 640px) { .editor-row { flex-direction: row; align-items: center; } }

    .drag-handle {
      cursor: grab;
      color: var(--muted);
      font-size: 18px;
      padding: 0 4px;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .drag-handle:active { cursor: grabbing; }

    .image-pick-container { display: flex; gap: 6px; align-items: center; }
    .image-pick-wrap { position: relative; width: 48px; height: 64px; }
    .image-pick { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; background: #1e293b; color: #94a3b8; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
    .image-pick img { width: 100%; height: 100%; object-fit: cover; }
    .image-clear-btn { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ef4444; color: #fff; border: none; font-size: 10px; display: grid; place-items: center; cursor: pointer; z-index: 2; padding: 0; line-height: 1; }
    .field-file { display: none; }

    input[type="text"], input[type="number"], select { width: 100%; padding: 6px 10px; color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; background: #0f172a; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #a78bfa; }

    .field-card-panel { background: rgba(6, 78, 59, 0.25); border-color: rgba(16, 185, 129, 0.2); }
    
    .zone { min-height: 120px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; padding: 12px 6px; }
    .empty-zone { width: 100%; min-height: 80px; display: grid; place-items: center; border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 10px; color: #64748b; font-size: 13px; text-align: center; padding: 10px; }
    .empty-hand { width: 100%; min-height: 70px; display: grid; place-items: center; color: #64748b; font-size: 13px; }

    .hand-zone { display: flex; gap: 16px; overflow-x: auto; padding: 12px 6px; min-height: 120px; align-items: center; }

    .card-tree-node {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }
    .card-tree-children {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: -30px;
      padding-left: 16px;
      border-left: 2px dashed rgba(167, 139, 250, 0.4);
      z-index: 2;
    }

    .card-wrapper {
      position: relative;
      display: inline-block;
      z-index: 1;
      flex-shrink: 0;
    }

    .game-card {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      text-align: left;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      cursor: grab;
      transition: box-shadow 0.2s;
      padding: 0;
      margin: 0;
    }
    .game-card * { pointer-events: none; }

    .game-card.disabled-click { cursor: default !important; }
    .game-card:active { cursor: grabbing; }
    .game-card.disabled-click:active { cursor: default !important; }
    .game-card:hover { box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4); z-index: 10; }
    .game-card.normal { width: 70px; height: 98px; }
    .game-card.compact { width: 56px; height: 80px; }

    .game-card img.bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .game-card .bg-gradient { position: absolute; inset: 0; }
    .game-card .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 40%, rgba(255,255,255,0.1) 100%); }
    .game-card .card-content-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px; }
    .game-card .card-content-text p {
      margin: 0; font-weight: 700; line-height: 1.15; color: #fff; font-size: 9px;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .game-card.faced-down { background: linear-gradient(135deg, #1e293b, #0f172a); border-color: rgba(255, 255, 255, 0.2); }
    .card-back-pattern {
      position: absolute; inset: 4px; border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 6px;
      display: grid; place-items: center; color: #64748b; font-weight: 800; font-size: 9px; letter-spacing: 0.1em;
    }

    .stats-grid { 
      display: grid; 
      gap: 10px; 
      grid-template-columns: 20% 20% 1fr; 
    }
    @media(max-width: 900px) { 
      .stats-grid { 
        grid-template-columns: 1fr; 
      } 
    }
    
    .stat-card { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
    
    .stat-label {
      margin: 0 0 2px 0;
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }
    .stat-value {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .counter-list-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding: 2px 0;
      align-items: center;
    }
    .counter-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 140px;
      position: relative;
    }
    .counter-item input[type="number"] {
      width: 55px;
      text-align: center;
      padding: 2px 4px;
      height: 28px;
      font-size: 13px;
      font-weight: bold;
    }
    .counter-item input[type="text"] {
      width: 65px;
      padding: 2px 6px;
      height: 28px;
      font-size: 12px;
    }
    .counter-del-btn {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      border: none;
      font-size: 9px;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .modal-overlay {
      position: absolute;
      top: 64px;
      left: 0;
      right: var(--preview-width);
      bottom: var(--dock-height);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, right 0.1s ease, bottom 0.1s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px;
      width: min(600px, 92vw); max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex; flex-direction: column; gap: 12px; position: relative;
    }
    .modal-content h3 { margin: 0; font-size: 15px; font-weight: 700; color: #f8fafc; }

    .zoom-modal-content { width: min(70vw, 640px); max-width: 95vw; height: auto; }
    
    .zoom-card-large {
      width: min(45vw, 260px);
      height: auto;
      aspect-ratio: 70 / 98;
      font-size: 14px;
    }
    .preview-card-large {
      width: 100%;
      max-width: calc(var(--preview-width) - 24px);
      height: auto;
      aspect-ratio: 70 / 98;
      font-size: 12px;
    }

    .deck-list-modal { display: flex; flex-direction: column; gap: 8px; overflow-y: visible; }
    .deck-list-item {
      display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; gap: 8px; flex-wrap: wrap;
    }

    .controls-bar {
      display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; background: rgba(255, 255, 255, 0.03);
      padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; white-space: nowrap;
    }
    .controls-bar select, .controls-bar input { padding: 4px 6px; font-size: 13px; height: 30px; }

    .log-list {
      display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; font-size: 13px;
      color: #cbd5e1; background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
  </style>
</head>
<body>
  <div class="app-layout">
    <header>
      <div class="eyebrow-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="eyebrow">LOCAL CARD TABLE</span>
      </div>
      <div class="actions">
        <button class="btn secondary" id="openHelpModalBtn">説明</button>
        <button class="btn secondary" id="addFieldBtn" style="border-style: dashed;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          場を追加
        </button>
        <button class="btn secondary" id="openEditorModalBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          デッキ編集
        </button>
        <button class="btn primary" id="startButton">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          ゲーム開始
        </button>
        <button class="btn danger-ghost" id="resetButton">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
          リセット
        </button>
        <button class="btn secondary" id="openLogModalBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          ログ
        </button>
      </div>
    </header>

    <main class="app">
      <div class="scroll-content">
        <section class="play-area">
          <div id="fieldsContainer" style="display: flex; flex-direction: column; gap: 16px; width: 100%;"></div>
        </section>
      </div>

      <div class="bottom-dock" id="bottomDock">
        <div class="stats-grid">
          <section class="panel stat-card" id="deckDropZone">
            <div class="stat-info">
              <p class="stat-label">DECK</p>
              <p class="stat-value" id="deckCount">0</p>
            </div>
            <div class="actions" style="gap: 4px;">
              <button class="btn secondary" id="inspectDeckBtn" disabled style="padding: 4px 6px; font-size: 10px;">
                確認
              </button>
              <button class="btn secondary" id="deckVisibilityToggleBtn" style="padding: 4px 6px; font-size: 10px; background: #7c3aed;">
                非公開
              </button>
              <button class="btn secondary" id="shuffleButton" disabled style="padding: 4px 6px; font-size: 10px;" title="シャッフル">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              </button>
            </div>
          </section>

          <section class="panel stat-card" id="discardDropZone">
            <div class="stat-info">
              <p class="stat-label">DISCARD</p>
              <p class="stat-value" id="discardCountBadge">0</p>
            </div>
            <div class="actions">
              <button class="btn secondary" id="inspectDiscardBtn" disabled style="padding: 4px 8px; font-size: 11px;">
                確認
              </button>
            </div>
          </section>

          <section class="panel stat-card" id="counterPanel" style="flex-direction: column; align-items: stretch; gap: 6px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div class="stat-info">
                <p class="stat-label">COUNTER</p>
              </div>
              <button class="btn secondary" id="addCounterBtn" style="padding: 2px 8px; font-size: 12px;" title="カウンタ追加">＋</button>
            </div>
            <div class="counter-list-container" id="counterListContainer">
              <div style="color: #64748b; font-size: 11px; padding: 4px;">＋で追加</div>
            </div>
          </section>
        </div>

        <details class="panel" id="handDetails" open style="width: 100%;">
          <summary class="panel-head">
            <h2>手札 <span style="font-size: 13px; font-weight: normal; color: #94a3b8; margin-left: 6px;" id="handCount">0枚</span></h2>
            
            <div class="controls-bar" id="handControlsBar" onclick="event.stopPropagation()">
              <button type="button" class="btn secondary" id="handPrivacyToggleBtn" style="background: #7c3aed; font-size: 12px; padding: 4px 8px;" title="右クリック時の動作切替">非公開</button>
              <label style="display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; margin-right: 4px;">
                <input type="checkbox" id="handEnableClick" style="width: auto;" checked> クリック時:
              </label>
              <select id="handActionSelect" style="width: auto;"></select>
              <button type="button" class="btn secondary" id="handFacingToggleBtn" style="width: 45px; height: 30px; padding: 0; justify-content: center; font-size: 12px;">表</button>
              <div id="handDeckOptions" style="display: none; align-items: center; gap: 4px;">
                <select id="handDeckPos" style="width: 60px;">
                  <option value="top">上</option>
                  <option value="bottom">下</option>
                </select>
                <input type="number" id="handDeckNum" min="1" value="1" style="width: 45px;" placeholder="枚目">

            <span style="font-size: 12px; color: #94a3b8;">°</span>

          </div>

        <div id="zoomChainContainer" style="width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); font-size: 12px;">
          <div style="color: #94a3b8; font-weight: bold; margin-bottom: 2px;">親子系譜 (クリックで詳細切替):</div>
          <div id="zoomChainList" style="display: flex; flex-direction: column; gap: 3px;"></div>

        <div id="zoomCardContainer" style="display: flex; align-items: center; justify-content: center; margin: 6px 0; transition: transform 0.1s;"></div>
